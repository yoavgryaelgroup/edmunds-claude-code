<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדגמת עוזר WhatsApp</title>
<style>
  :root { --bg: #efeae2; --panel: #ffffff; --me: #d9fdd3; --them: #ffffff; --ink: #111b21; --muted: #667781;
          --bar: #008069; --line: #d1d7db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b141a; --panel: #111b21; --me: #005c4b; --them: #202c33; --ink: #e9edef; --muted: #8696a0;
            --bar: #202c33; --line: #2a3942; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; max-width: 1100px; margin: 0 auto;
          padding: 16px; height: 100vh; }
  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; height: auto; } .chat { height: 80vh; } }
  .chat { display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line);
          border-radius: 12px; overflow: hidden; min-height: 0; }
  header { background: var(--bar); color: #fff; padding: 12px 16px; display: flex; gap: 8px; align-items: center;
           flex-wrap: wrap; }
  header b { flex: 1; }
  header input { width: 150px; padding: 4px 8px; border-radius: 6px; border: 0; direction: ltr; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; line-height: 1.45;
         box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .me { align-self: flex-start; background: var(--me); }
  .them { align-self: flex-end; background: var(--them); }
  .note { align-self: center; font-size: 12px; color: var(--muted); background: var(--panel); padding: 4px 10px;
          border-radius: 6px; }
  form { display: flex; gap: 8px; padding: 10px; background: var(--panel); border-top: 1px solid var(--line); }
  form input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--line);
               background: var(--bg); color: var(--ink); font-size: 15px; }
  button { background: var(--bar); color: #fff; border: 0; border-radius: 20px; padding: 0 18px; font-size: 15px;
           cursor: pointer; }
  button:disabled { opacity: .5; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
          overflow-y: auto; min-height: 0; }
  aside h2 { font-size: 16px; margin: 0 0 8px; }
  aside .appt { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 14px; }
  aside .muted { color: var(--muted); font-size: 12px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #f7d774; color: #111; }
</style>
</head>
<body>
<div class="wrap">
  <section class="chat">
    <header>
      <b>מרפאת השיניים – עוזר WhatsApp (הדגמה)</b>
      <label>מספר מטופל: <input id="phone" value="972500000001"></label>
    </header>
    <div id="log"><div class="note">כתבו הודעה כמו שמטופל/ת היה כותב/ת ב-WhatsApp, למשל: "שלום, אפשר לקבוע תור לניקוי שיניים?"</div></div>
    <form id="f">
      <input id="text" autocomplete="off" placeholder="הקלידו הודעה">
      <button id="send">שליחה</button>
    </form>
  </section>
  <aside>
    <h2>יומן המרפאה</h2>
    <div class="muted" id="cal"></div>
    <div id="appts"></div>
    <h2 style="margin-top:16px">פניות לצוות</h2>
    <div id="handoffs" class="muted">אין</div>
  </aside>
</div>
<script>
const log = document.getElementById('log');
function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function note(text) {
  const d = document.createElement('div'); d.className = 'note'; d.textContent = text; log.appendChild(d);
}
async function refresh() {
  try {
    const r = await (await fetch('/demo/appointments')).json();
    document.getElementById('cal').textContent = r.calendar === 'GoogleCalendar'
      ? 'מחובר ל-Google Calendar' : 'יומן הדגמה בזיכרון (לא מחובר ל-Google)';
    const box = document.getElementById('appts'); box.innerHTML = '';
    if (!r.appointments.length) box.innerHTML = '<div class="muted">אין תורים</div>';
    for (const a of r.appointments) {
      const d = document.createElement('div'); d.className = 'appt';
      d.textContent = `${a.label} · ${a.type} · ${a.name} `;
      if (a.status === 'tentative') { const t = document.createElement('span'); t.className = 'tag';
        t.textContent = 'ממתין לאישור'; d.appendChild(t); }
      box.appendChild(d);
    }
    const h = document.getElementById('handoffs');
    h.textContent = r.handoffs.length ? '' : 'אין';
    for (const x of r.handoffs) { const d = document.createElement('div'); d.className = 'appt';
      d.textContent = `${x.urgent ? 'דחוף · ' : ''}+${x.phone}: ${x.reason}`; h.appendChild(d); }
  } catch (e) {}
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const input = document.getElementById('text'), btn = document.getElementById('send');
  const text = input.value.trim(); if (!text) return;
  add(text, 'me'); input.value = ''; btn.disabled = true;
  try {
    const r = await fetch('/demo/message', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: document.getElementById('phone').value, text})});
    const raw = await r.text();
    let data;
    try { data = JSON.parse(raw); } catch (e) { throw new Error(`${r.status}: ${raw.slice(0, 200)}`); }
    if (!r.ok) throw new Error(data.detail || r.status);
    add(data.reply, 'them');
    for (const n of data.notifications || []) note(`נשלחה הודעת ${n.template} אל ${n.to}: ${n.params.join(' | ')}`);
  } catch (e) { note('שגיאה: ' + e.message); }
  btn.disabled = false; input.focus(); refresh();
});
refresh();
</script>
</body>
</html>
